<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Galaxy - Radical Designs</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(20px);
            z-index: 999;
        }

        nav .logo {
            font-size: 18px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li {
            cursor: pointer;
            transition: 0.3s;
        }

        nav ul li:hover {
            color: #6a00ff;
        }

        header {
            background: linear-gradient(135deg, #6a00ff 0%, #ff006e 100%);
            text-align: center;
            padding: 100px 30px 30px;
            margin-top: 60px;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(106, 0, 255, 0.5);
        }

        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card h3 {
            padding: 15px;
            text-align: center;
            color: #6a00ff;
        }

        .carousel-section {
            padding: 50px 30px;
            background: #1a1a2e;
            margin: 30px 0;
        }

        .carousel-section h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #6a00ff;
        }

        .carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 20px;
        }

        .slide {
            min-width: 300px;
            height: 300px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.5s;
            object-fit: cover;
        }

        .slide.active {
            opacity: 1;
            box-shadow: 0 0 30px rgba(106, 0, 255, 0.8);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #000;
            border-top: 1px solid #6a00ff;
        }

        footer p {
            margin: 0;
            color: #999;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">✦ Moonlit Archive ✦</div>
        <ul>
            <li>#Featured</li>
            <li>#Gallery</li>
            <li>#Artists</li>
            <li>#Collections</li>
        </ul>
    </nav>

    <!-- Header -->
    <header>
        <h1>Anime Galaxy</h1>
        <p>Radical Designs - Anime Fantasy Fanart</p>
    </header>

    <!-- Gallery Section -->
    <section class="gallery">
        <div class="card">
            <img src="images/1789433278607.png" alt="Fanart #1" class="card-image">
            <h3>Fanart #1</h3>
        </div>

        <div class="card">
            <img src="images/1789433492040.png" alt="Fanart #2" class="card-image">
            <h3>Fanart #2</h3>
        </div>

        <div class="card">
            <img src="images/1789433604363.png" alt="Fanart #3" class="card-image">
            <h3>Fanart #3</h3>
        </div>

        <div class="card">
            <img src="images/1789434074925.png" alt="Fanart #4" class="card-image">
            <h3>Fanart #4</h3>
        </div>

        <div class="card">
            <img src="images/1789450903936.png" alt="Fanart #5" class="card-image">
            <h3>Fanart #5</h3>
        </div>

        <div class="card">
            <img src="images/1789450903936.png" alt="Fanart #6" class="card-image">
            <h3>Fanart #6</h3>
        </div>
    </section>

    <!-- Carousel Section -->
    <section class="carousel-section">
        <h2>Featured Carousel</h2>
        <div class="carousel">
            <img src="images/1789433278607.png" alt="Slide 1" class="slide active">
            <img src="images/1789433492040.png" alt="Slide 2" class="slide">
            <img src="images/1789433604363.png" alt="Slide 3" class="slide">
            <img src="images/1789434074925.png" alt="Slide 4" class="slide">
            <img src="images/1789450903936.png" alt="Slide 5" class="slide">
            <img src="images/1789450903936.png" alt="Slide 6" class="slide">
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Anime Galaxy - Radical Designs | All Rights Reserved</p>
    </footer>

    <!-- Auto Sliding Carousel Script -->
    <script>
        let slides = document.querySelectorAll('.slide');
        let current = 0;

        setInterval(() => {
            slides[current].classList.remove('active');
            current++;

            if (current >= slides.length) {
                current = 0;
            }

            slides[current].classList.add('active');
        }, 5000);
    </script>

</body>

</html>
